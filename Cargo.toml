[workspace]
resolver = "3"
members = ["compiler", "worker"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/gntik-ai/falcone-serverless"

# Crates for WAS-01 (#115): Wasmtime qualification runner. The engine is pinned exactly to
# the newest release published before 2026-10-17; wasmparser matches the wasm-tools family
# wasmtime uses. The worker sandbox is offline and only reads crates already in Cargo.lock.
[workspace.dependencies]
wasmtime = { version = "=49.0.5", default-features = false, features = ["cranelift", "runtime", "std", "wat", "component-model"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
wasmparser = "=0.258.3"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
