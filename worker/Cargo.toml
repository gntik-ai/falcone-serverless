[package]
name = "falcone-serverless-worker"
version = "0.1.0"
description = "Falcone serverless execution worker (Wasmtime/WASI host). Placeholder until RUN-01."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/qualification/posture.rs"

[lints]
workspace = true

[features]
# Test and qualification builds only: delay hooks and validation counters of the execution
# API server. Never enabled in the production image.
qualification = []

# Shared crates for the first contract tasks (#60, #65, #67, #100). The worker sandbox is
# offline and only reads crates already in Cargo.lock, so they are added here once, at
# reviewed versions released at least two weeks ago.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
# Standalone OCI conformance tester: safe process signals, already locked by compiler.
rustix = { version = "=1.1.5", features = ["process", "fs"] }
toml = { workspace = true }
# Wasmtime engine for the WAS-01 qualification runner (#115).
wasmtime = { workspace = true, features = ["call-hook"] }

wasmparser = { workspace = true }
sha2 = { workspace = true }
# Already locked; authenticates only process-local trusted compiler output.
ring = "=0.17.14"
# Already locked (1.1.5, through regex): one leftmost-longest matcher for log redaction.
aho-corasick = "=1.1.5"

[[bin]]
name = "artifact-compile-child"
path = "src/artifact/compile_child.rs"

[[bin]]
name = "compile-cache-qualification"
path = "src/qualification/compile_cache_runner.rs"

# Restricted-pod qualification of the execution API (RUN-01.t3); test hooks need the feature.
[[bin]]
name = "execute-api-qualification"
path = "src/qualification/execute_api_runner.rs"
required-features = ["qualification"]

[dev-dependencies]
# Turns on the test-only hooks of the execution API server for this package's own tests.
falcone-serverless-worker = { path = ".", features = ["qualification"] }
wat = "=1.258.3"
wit-parser = "=0.262.0"
# WAS-01 static checks (#115).
toml = { workspace = true }
# Language profile matrix schema checks (#97); no remote/file reference resolution.
jsonschema = { version = "0.59.0", default-features = false }
# Restricted fs-test cluster harness (#121): Kubernetes client (rustls + ring, no OpenSSL),
# async runtime and RNG for the UID chooser. Test-only; reviewed versions >= 2 weeks old.
# kube 3.1 rather than 4.x: kube 4 pulls serde-saphyr, which caps smallvec below 1.16 and
# would downgrade the smallvec that the production Wasmtime/Cranelift build uses.
kube = { version = "=3.1.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.27.1", default-features = false, features = ["std", "v1_35"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "time"] }
rand = "=0.10.3"
