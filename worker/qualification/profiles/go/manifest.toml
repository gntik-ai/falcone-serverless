[[workloads]]
name = "hash-sha256"
source = "examples/hash-sha256/main.go"
input = "examples/hash-sha256/input.json"
expected = "examples/hash-sha256/expected.json"
imports = []

[[workloads]]
name = "byte-stats"
source = "examples/byte-stats/main.go"
input = "examples/byte-stats/input.json"
expected = "examples/byte-stats/expected.json"
imports = []

[[workloads]]
name = "random-bytes"
source = "examples/random-bytes/main.go"
input = "examples/random-bytes/input.json"
expected = "examples/random-bytes/expected.json"
# crypto/rand reads wasi:random through the TinyGo runtime; nothing is imported by the source.
imports = []

[[workloads]]
name = "events-handle"
source = "examples/events-handle/main.go"
request = "examples/events-handle/request.json"
cases = "examples/events-handle/cases.json"
imports = ["falcone:host/events@0.2.0"]

[diagnostics."WASM-NATIVE-LIBRARY"]
message = "A native library, cgo or a plugin cannot run in Wasm mode. Port it to pure Go; OCI mode is a separate, explicitly authorized choice."
[diagnostics."WASM-GPU"]
message = "GPU access is outside the falcone:host capability host and is rejected."
[diagnostics."WASM-PROCESS-SPAWN"]
message = "Spawning a process (os/exec) is not available in Wasm mode."
[diagnostics."WASM-INSTALL-HOOK"]
message = "go:generate and other install or build hooks are never run; nothing is installed."
[diagnostics."WASM-PACKAGE-NOT-IN-CATALOGUE"]
message = "The module, or its version, is not in the pinned package catalogue. Qualification and the build are rejected and nothing is downloaded. OCI mode is a separate, explicitly authorized alternative."
[diagnostics."WASM-UNSUPPORTED-API"]
message = "The package or API is outside this profile's supported subset, including documented TinyGo limits."

# One negative fixture per code: `path` is a source directory of the module, `file`, `line` and
# `column` locate the one diagnostic it must yield, and nothing is built or run for any of them.
[[negative]]
code = "WASM-NATIVE-LIBRARY"
path = "negative/native-library"
file = "negative/native-library/main.go"
line = 6
column = 8

[[negative]]
code = "WASM-GPU"
path = "negative/gpu"
file = "negative/gpu/main.go"
line = 4
column = 2

[[negative]]
code = "WASM-PROCESS-SPAWN"
path = "negative/process-spawn"
file = "negative/process-spawn/main.go"
line = 4
column = 2

[[negative]]
code = "WASM-INSTALL-HOOK"
path = "negative/install-hook"
file = "negative/install-hook/main.go"
line = 3
column = 1

[[negative]]
code = "WASM-PACKAGE-NOT-IN-CATALOGUE"
path = "negative/package-not-in-catalogue"
file = "negative/package-not-in-catalogue/main.go"
line = 4
column = 2

[[negative]]
code = "WASM-UNSUPPORTED-API"
path = "negative/unsupported-api"
file = "negative/unsupported-api/main.go"
line = 8
column = 6
