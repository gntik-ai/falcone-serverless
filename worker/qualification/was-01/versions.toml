wasmtime_version = "49.0.5"
compilation_backend = "cranelift"
# Exact wasmtime build: default features off, these features on (kept in sync with Cargo.toml).
wasmtime_default_features = false
wasmtime_features = ["cranelift", "runtime", "std", "wat", "component-model"]
target_arch = "x86_64"
target_os = "linux"
rust_toolchain = "1.99.1"
wasi_interface = "none"
qualification_status = "unqualified"
contract_inventory_path = "docs/contracts/falcone-contract-inventory.md"
contract_inventory_sha256 = "2bb58e1278bd7790ebfa1bea6679d3e997f7d7366519e67f9663d9929261b2a4"
kubernetes_version = "unverified"
openshift_version = "unverified"
namespaced_permissions = "unverified"

[engine]
consume_fuel = true
epoch_interruption = true
fuel_limit = 10000000
epoch_tick_ms = 10
epoch_deadline_ticks = 100
# TOML integers are signed 64-bit; record these unsigned limits as decimal strings.
epoch_run_fuel = "18446744073709551615"
fuel_run_epoch_deadline = "18446744073709551615"
